<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="600"
  viewBox="0 0 1200 600"
>

  <defs>

    <!-- ================= BACKGROUND ================= -->

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>


    <!-- ================= TITLE ================= -->

    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>


    <!-- ================= CORE ================= -->

    <radialGradient id="coreGlow">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#a78bfa" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>


    <!-- ================= GLOW ================= -->

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- ================================================= -->
  <!-- MAIN CONTAINER -->
  <!-- ================================================= -->

  <rect
    x="8"
    y="8"
    width="1184"
    height="584"
    rx="30"
    fill="url(#bg)"
    stroke="#293043"
    stroke-width="2"
  />


  <!-- ================================================= -->
  <!-- TITLE -->
  <!-- ================================================= -->

  <text
    x="600"
    y="58"
    text-anchor="middle"
    fill="url(#titleGradient)"
    font-family="Arial, sans-serif"
    font-size="38"
    font-weight="700"
  >
    TECH STACK
  </text>


  <text
    x="600"
    y="84"
    text-anchor="middle"
    fill="#64748b"
    font-family="monospace"
    font-size="12"
  >
    Technologies I use to build software
  </text>


  <!-- ================================================= -->
  <!-- TECHNOLOGY CHIP GRID -->
  <!-- ================================================= -->


  <!-- FRONTEND -->

  <rect
    x="55"
    y="115"
    width="235"
    height="42"
    rx="21"
    fill="#22d3ee"
    fill-opacity="0.08"
    stroke="#22d3ee"
    stroke-opacity="0.55"
  />

  <text
    x="172"
    y="142"
    text-anchor="middle"
    fill="#22d3ee"
    font-family="monospace"
    font-size="14"
    font-weight="600"
  >
    FRONTEND
  </text>


  <!-- MOTION -->

  <rect
    x="310"
    y="115"
    width="235"
    height="42"
    rx="21"
    fill="#a78bfa"
    fill-opacity="0.08"
    stroke="#a78bfa"
    stroke-opacity="0.55"
  />

  <text
    x="427"
    y="142"
    text-anchor="middle"
    fill="#a78bfa"
    font-family="monospace"
    font-size="14"
    font-weight="600"
  >
    MOTION &amp; 3D
  </text>


  <!-- DATA -->

  <rect
    x="655"
    y="115"
    width="210"
    height="42"
    rx="21"
    fill="#f472b6"
    fill-opacity="0.08"
    stroke="#f472b6"
    stroke-opacity="0.55"
  />

  <text
    x="760"
    y="142"
    text-anchor="middle"
    fill="#f472b6"
    font-family="monospace"
    font-size="14"
    font-weight="600"
  >
    DATA
  </text>


  <!-- AI -->

  <rect
    x="885"
    y="115"
    width="210"
    height="42"
    rx="21"
    fill="#22d3ee"
    fill-opacity="0.08"
    stroke="#22d3ee"
    stroke-opacity="0.55"
  />

  <text
    x="990"
    y="142"
    text-anchor="middle"
    fill="#22d3ee"
    font-family="monospace"
    font-size="14"
    font-weight="600"
  >
    AI
  </text>


  <!-- ================================================= -->
  <!-- ORBIT AREA -->
  <!-- ================================================= -->


  <!-- Outer orbit -->

  <ellipse
    cx="600"
    cy="370"
    rx="440"
    ry="170"
    fill="none"
    stroke="#22d3ee"
    stroke-width="1"
    stroke-opacity="0.20"
    transform="rotate(-7 600 370)"
  />


  <!-- Middle orbit -->

  <ellipse
    cx="600"
    cy="370"
    rx="350"
    ry="130"
    fill="none"
    stroke="#a78bfa"
    stroke-width="1"
    stroke-opacity="0.22"
    transform="rotate(9 600 370)"
  />


  <!-- Inner orbit -->

  <ellipse
    cx="600"
    cy="370"
    rx="260"
    ry="90"
    fill="none"
    stroke="#f472b6"
    stroke-width="1"
    stroke-opacity="0.20"
    transform="rotate(-12 600 370)"
  />


  <!-- ================================================= -->
  <!-- ORBIT ANIMATION -->
  <!-- ================================================= -->

  <!-- Outer moving particle -->

  <circle
    cx="600"
    cy="200"
    r="4"
    fill="#22d3ee"
    filter="url(#glow)"
  >

    <animateMotion
      dur="10s"
      repeatCount="indefinite"
      path="
      M0,0
      C210,-45 440,35 440,170
      C440,305 210,215 0,170
      C-210,215 -440,305 -440,170
      C-440,35 -210,-45 0,0
      "
    />

  </circle>


  <!-- Second particle -->

  <circle
    cx="600"
    cy="240"
    r="4"
    fill="#a78bfa"
    filter="url(#glow)"
  >

    <animateMotion
      dur="8s"
      repeatCount="indefinite"
      path="
      M0,0
      C170,-35 350,25 350,130
      C350,235 170,165 0,130
      C-170,165 -350,235 -350,130
      C-350,25 -170,-35 0,0
      "
    />

  </circle>


  <!-- Third particle -->

  <circle
    cx="600"
    cy="280"
    r="4"
    fill="#f472b6"
    filter="url(#glow)"
  >

    <animateMotion
      dur="7s"
      repeatCount="indefinite"
      path="
      M0,0
      C130,-25 260,20 260,90
      C260,160 130,115 0,90
      C-130,115 -260,160 -260,90
      C-260,20 -130,-25 0,0
      "
    />

  </circle>


  <!-- ================================================= -->
  <!-- CORE GLOW -->
  <!-- ================================================= -->

  <circle
    cx="600"
    cy="370"
    r="170"
    fill="url(#coreGlow)"
  />


  <!-- ================================================= -->
  <!-- CORE -->
  <!-- ================================================= -->

  <circle
    cx="600"
    cy="370"
    r="82"
    fill="#0d1424"
    stroke="#22d3ee"
    stroke-width="2"
    filter="url(#glow)"
  >

    <animate
      attributeName="r"
      values="78;84;78"
      dur="3s"
      repeatCount="indefinite"
    />

  </circle>


  <text
    x="600"
    y="365"
    text-anchor="middle"
    fill="#f8fafc"
    font-family="monospace"
    font-size="17"
    font-weight="700"
  >
    ✦ CORE ✦
  </text>


  <text
    x="600"
    y="390"
    text-anchor="middle"
    fill="#64748b"
    font-family="monospace"
    font-size="10"
  >
    SOFTWARE ENGINEERING
  </text>


  <!-- ================================================= -->
  <!-- SKILL 1 - REACT -->
  <!-- ================================================= -->

  <g>

    <circle
      cx="600"
      cy="205"
      r="34"
      fill="#111827"
      stroke="#22d3ee"
      stroke-width="2"
    />

    <text
      x="600"
      y="210"
      text-anchor="middle"
      fill="#22d3ee"
      font-family="monospace"
      font-size="13"
      font-weight="600"
    >
      React
    </text>

  </g>


  <!-- ================================================= -->
  <!-- SKILL 2 - PYTHON -->
  <!-- ================================================= -->

  <g>

    <circle
      cx="305"
      cy="315"
      r="38"
      fill="#111827"
      stroke="#a78bfa"
      stroke-width="2"
    />

    <text
      x="305"
      y="320"
      text-anchor="middle"
      fill="#a78bfa"
      font-family="monospace"
      font-size="13"
      font-weight="600"
    >
      Python
    </text>

  </g>


  <!-- ================================================= -->
  <!-- SKILL 3 - FASTAPI -->
  <!-- ================================================= -->

  <g>

    <circle
      cx="895"
      cy="315"
      r="38"
      fill="#111827"
      stroke="#22d3ee"
      stroke-width="2"
    />

    <text
      x="895"
      y="320"
      text-anchor="middle"
      fill="#22d3ee"
      font-family="monospace"
      font-size="12"
      font-weight="600"
    >
      FastAPI
    </text>

  </g>


  <!-- ================================================= -->
  <!-- SKILL 4 - PYTORCH -->
  <!-- ================================================= -->

  <g>

    <circle
      cx="390"
      cy="485"
      r="40"
      fill="#111827"
      stroke="#f472b6"
      stroke-width="2"
    />

    <text
      x="390"
      y="490"
      text-anchor="middle"
      fill="#f472b6"
      font-family="monospace"
      font-size="12"
      font-weight="600"
    >
      PyTorch
    </text>

  </g>


  <!-- ================================================= -->
  <!-- SKILL 5 - SQL -->
  <!-- ================================================= -->

  <g>

    <circle
      cx="810"
      cy="485"
      r="38"
      fill="#111827"
      stroke="#a78bfa"
      stroke-width="2"
    />

    <text
      x="810"
      y="490"
      text-anchor="middle"
      fill="#a78bfa"
      font-family="monospace"
      font-size="13"
      font-weight="600"
    >
      SQL
    </text>

  </g>


  <!-- ================================================= -->
  <!-- SKILL 6 - GIT -->
  <!-- ================================================= -->

  <g>

    <circle
      cx="600"
      cy="535"
      r="32"
      fill="#111827"
      stroke="#22d3ee"
      stroke-width="2"
    />

    <text
      x="600"
      y="540"
      text-anchor="middle"
      fill="#22d3ee"
      font-family="monospace"
      font-size="13"
      font-weight="600"
    >
      Git
    </text>

  </g>


  <!-- ================================================= -->
  <!-- BOTTOM LABEL -->
  <!-- ================================================= -->

  <text
    x="600"
    y="575"
    text-anchor="middle"
    fill="#64748b"
    font-family="monospace"
    font-size="11"
  >
    FRONTEND • BACKEND • DATA • AI
  </text>


</svg>