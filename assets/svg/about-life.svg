    <linearGradient id="aboutBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0e16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0d0e16"/>
    </linearGradient>

    <!-- Accent -->
